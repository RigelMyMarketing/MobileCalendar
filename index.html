<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RIGEL LED — Content Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<!-- Firebase SDK (compat build — plain <script> tags, no build step needed) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
/* ==========================================================================
   RIGEL LED · CONTENT CALENDAR
   --------------------------------------------------------------------------
   DESIGN TOKENS
   ========================================================================== */
:root{
  --rigel-navy:        #12357f;
  --rigel-navy-700:     #0d2a66;
  --rigel-navy-900:     #081c47;
  --rigel-navy-100:     #e8edf9;
  --rigel-navy-050:     #f4f6fc;
  --rigel-accent:       #17c3e0;   /* LED-glow cyan, used sparingly */
  --rigel-accent-100:   #e3f9fc;

  --bg:                 #f5f6f9;
  --surface:             #ffffff;
  --surface-muted:       #fbfbfd;
  --border:              #e4e7ee;
  --border-strong:       #d3d8e3;

  --text:                #1a2138;
  --text-muted:          #667085;
  --text-faint:          #98a1b3;

  --danger:              #d64545;
  --danger-100:          #fbe9e9;
  --success:             #1f9d55;

  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 16px;

  --shadow-sm: 0 1px 2px rgba(18,53,127,0.06);
  --shadow-md: 0 6px 20px rgba(18,53,127,0.10);
  --shadow-lg: 0 16px 40px rgba(18,53,127,0.18);

  --font-ui: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-display: 'Manrope', 'Inter', sans-serif;

  --tag-blue:   #3b7ddb;
  --tag-teal:   #17b3a3;
  --tag-violet: #7b6bd6;
  --tag-amber:  #d99a2b;
  --tag-rose:   #d6537b;
  --tag-navy:   #12357f;
  --tag-slate:  #5b6b8c;
}

*{ box-sizing:border-box; }
html,body{ height:100%; }
body{
  margin:0;
  font-family:var(--font-ui);
  color:var(--text);
  background:var(--bg);
  -webkit-font-smoothing:antialiased;
}
button{ font-family:inherit; }
input, select, textarea{ font-family:inherit; }
::selection{ background:var(--rigel-accent-100); }

@media (prefers-reduced-motion: reduce){
  *{ animation-duration:0.001ms !important; transition-duration:0.001ms !important; }
}

/* ==========================================================================
   APP SHELL
   ========================================================================== */
#app{
  display:flex;
  height:100vh;
  min-height:560px;
  overflow:hidden;
}

/* ---- Sidebar ---- */
.sidebar{
  width:232px;
  min-width:232px;
  background:var(--rigel-navy);
  background-image: radial-gradient(circle at 15% 0%, var(--rigel-navy-700) 0%, var(--rigel-navy) 55%);
  color:#fff;
  display:flex;
  flex-direction:column;
  padding:22px 18px 18px;
}
.sidebar .brand{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:26px;
}
.sidebar .brand img{
  height:30px;
  width:auto;
  display:block;
}
.sidebar .brand .brand-sub{
  font-size:10.5px;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:rgba(255,255,255,0.55);
  margin-top:2px;
  font-weight:600;
}

.btn-new-event{
  display:flex;
  align-items:center;
  gap:9px;
  justify-content:center;
  background:var(--rigel-accent);
  color:var(--rigel-navy-900);
  border:none;
  border-radius:var(--radius-md);
  padding:12px 14px;
  font-weight:700;
  font-size:13.5px;
  cursor:pointer;
  box-shadow:0 4px 14px rgba(23,195,224,0.35);
  transition:transform .15s ease, box-shadow .15s ease;
  margin-bottom:22px;
}
.btn-new-event:hover{ transform:translateY(-1px); box-shadow:0 8px 20px rgba(23,195,224,0.45); }
.btn-new-event:active{ transform:translateY(0px) scale(.98); }
.btn-new-event svg{ width:16px; height:16px; }

.sidebar .mini-nav-label{
  font-size:10.5px;
  font-weight:700;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:rgba(255,255,255,0.4);
  margin:4px 2px 10px;
}

.legend{
  display:flex;
  flex-direction:column;
  gap:9px;
  margin-top:4px;
}
.legend-item{
  display:flex;
  align-items:center;
  gap:9px;
  font-size:12.5px;
  color:rgba(255,255,255,0.78);
}
.legend-dot{ width:9px; height:9px; border-radius:50%; flex:none; }

.sidebar-footer{
  margin-top:auto;
  padding-top:16px;
  border-top:1px solid rgba(255,255,255,0.12);
  font-size:11px;
  color:rgba(255,255,255,0.45);
  line-height:1.5;
}
.sync-dot{
  display:inline-block;
  width:7px;height:7px;
  border-radius:50%;
  background:#3ddc84;
  margin-right:6px;
  box-shadow:0 0 0 rgba(61,220,132,0.5);
  animation:pulseDot 2.2s infinite;
}
@keyframes pulseDot{
  0%{ box-shadow:0 0 0 0 rgba(61,220,132,0.45); }
  70%{ box-shadow:0 0 0 6px rgba(61,220,132,0); }
  100%{ box-shadow:0 0 0 0 rgba(61,220,132,0); }
}

/* ---- Main column ---- */
.main{
  flex:1;
  display:flex;
  flex-direction:column;
  min-width:0;
}

.topbar{
  display:flex;
  align-items:center;
  gap:14px;
  padding:14px 22px;
  border-bottom:1px solid var(--border);
  background:var(--surface);
  flex-wrap:wrap;
}
.nav-cluster{ display:flex; align-items:center; gap:6px; }
.icon-btn{
  width:32px; height:32px;
  display:flex; align-items:center; justify-content:center;
  border:1px solid var(--border);
  background:var(--surface);
  border-radius:8px;
  cursor:pointer;
  color:var(--text-muted);
  transition:background .12s ease, color .12s ease, border-color .12s ease;
}
.icon-btn:hover{ background:var(--rigel-navy-050); color:var(--rigel-navy); border-color:var(--border-strong); }
.icon-btn svg{ width:16px; height:16px; }

.btn-today{
  border:1px solid var(--border);
  background:var(--surface);
  padding:0 14px;
  height:32px;
  border-radius:8px;
  font-weight:600;
  font-size:13px;
  color:var(--text);
  cursor:pointer;
}
.btn-today:hover{ border-color:var(--border-strong); background:var(--rigel-navy-050); }

.current-label{
  font-family:var(--font-display);
  font-weight:800;
  font-size:18px;
  color:var(--rigel-navy-900);
  margin-left:2px;
  white-space:nowrap;
}

.topbar-spacer{ flex:1; }

.view-switch{
  display:flex;
  background:var(--rigel-navy-050);
  border:1px solid var(--border);
  border-radius:9px;
  padding:3px;
  gap:2px;
}
.view-switch button{
  border:none;
  background:transparent;
  padding:6px 13px;
  font-size:12.5px;
  font-weight:600;
  border-radius:6px;
  color:var(--text-muted);
  cursor:pointer;
  transition:background .12s ease, color .12s ease;
}
.view-switch button.active{
  background:var(--surface);
  color:var(--rigel-navy);
  box-shadow:var(--shadow-sm);
}

/* ==========================================================================
   VIEW CONTAINER
   ========================================================================== */
.view-container{
  flex:1;
  overflow:auto;
  position:relative;
  background:var(--surface);
}

/* ---- Month view ---- */
.month-grid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  border-top:1px solid var(--border);
  border-left:1px solid var(--border);
}
.month-weekday-row{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  border-bottom:1px solid var(--border);
  position:sticky;
  top:0;
  background:var(--surface);
  z-index:3;
}
.month-weekday-row div{
  padding:9px 0;
  text-align:center;
  font-size:11px;
  font-weight:700;
  letter-spacing:.08em;
  color:var(--text-faint);
  text-transform:uppercase;
}
.month-cell{
  border-right:1px solid var(--border);
  border-bottom:1px solid var(--border);
  min-height:112px;
  padding:6px 6px 8px;
  position:relative;
  display:flex;
  flex-direction:column;
  cursor:default;
  background:var(--surface);
  transition:background .12s ease;
}
.month-cell.outside{ background:var(--surface-muted); }
.month-cell.outside .date-num{ color:var(--text-faint); }
.month-cell:hover{ background:var(--rigel-navy-050); }

.date-num-row{ display:flex; justify-content:flex-end; margin-bottom:4px; }
.date-num{
  font-size:12.5px;
  font-weight:600;
  color:var(--text);
  width:24px; height:24px;
  display:flex; align-items:center; justify-content:center;
  border-radius:50%;
  cursor:pointer;
}
.date-num:hover{ background:var(--rigel-navy-100); }
.date-num.is-today{
  background:var(--rigel-navy);
  color:#fff;
  position:relative;
  animation:ledPulse 2.6s ease-in-out infinite;
}
@keyframes ledPulse{
  0%,100%{ box-shadow:0 0 0 0 rgba(23,195,224,0.55); }
  50%{ box-shadow:0 0 0 5px rgba(23,195,224,0.0); }
}

.event-list{ display:flex; flex-direction:column; gap:3px; overflow:hidden; }
.event-chip{
  display:flex;
  align-items:center;
  gap:5px;
  font-size:11.5px;
  font-weight:500;
  padding:3px 7px;
  border-radius:5px;
  background:var(--rigel-navy-100);
  color:var(--rigel-navy-900);
  cursor:pointer;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  border-left:3px solid var(--rigel-navy);
  transition:filter .1s ease;
}
.event-chip:hover{ filter:brightness(0.96); }
.event-chip .dot{ width:6px; height:6px; border-radius:50%; flex:none; }
.event-chip .chip-time{ color:var(--text-muted); font-weight:600; font-size:10.5px; flex:none; }
.event-chip .chip-name{ overflow:hidden; text-overflow:ellipsis; }

.more-link{
  font-size:11px;
  font-weight:700;
  color:var(--text-muted);
  padding:2px 7px;
  cursor:pointer;
}
.more-link:hover{ color:var(--rigel-navy); }

/* ---- Week / Day grid (time based) ---- */
.time-grid-wrap{ display:flex; flex-direction:column; height:100%; }
.time-header-row{
  display:flex;
  border-bottom:1px solid var(--border);
  position:sticky;
  top:0;
  background:var(--surface);
  z-index:3;
}
.time-gutter-spacer{ width:56px; flex:none; border-right:1px solid var(--border); }
.time-header-col{
  flex:1;
  padding:10px 4px;
  text-align:center;
  border-right:1px solid var(--border);
}
.time-header-col .dow{
  font-size:10.5px;
  font-weight:700;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--text-faint);
}
.time-header-col .dnum{
  margin:3px auto 0;
  width:30px; height:30px;
  display:flex; align-items:center; justify-content:center;
  border-radius:50%;
  font-weight:700;
  font-size:15px;
  color:var(--text);
}
.time-header-col.is-today .dnum{
  background:var(--rigel-navy);
  color:#fff;
}

.time-body{ flex:1; overflow-y:auto; position:relative; display:flex; }
.time-gutter{
  width:56px; flex:none;
  border-right:1px solid var(--border);
  position:relative;
}
.time-gutter .hour-label{
  position:absolute;
  right:8px;
  transform:translateY(-50%);
  font-size:10.5px;
  color:var(--text-faint);
  font-weight:600;
}
.time-columns{ flex:1; display:flex; position:relative; }
.time-col{
  flex:1;
  border-right:1px solid var(--border);
  position:relative;
}
.hour-line{
  position:absolute;
  left:0; right:0;
  border-top:1px solid var(--border);
}
.now-line{
  position:absolute; left:0; right:0;
  height:0;
  border-top:2px solid var(--danger);
  z-index:4;
}
.now-line::before{
  content:'';
  position:absolute;
  left:-4px; top:-4px;
  width:8px; height:8px;
  border-radius:50%;
  background:var(--danger);
}

.time-event{
  position:absolute;
  left:3px; right:3px;
  border-radius:7px;
  background:var(--rigel-navy);
  color:#fff;
  padding:5px 8px;
  font-size:11.5px;
  line-height:1.35;
  overflow:hidden;
  cursor:pointer;
  box-shadow:var(--shadow-sm);
  border-left:3px solid rgba(255,255,255,0.55);
  z-index:2;
}
.time-event .te-name{ font-weight:700; display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.time-event .te-time{ opacity:.85; font-size:10.5px; display:block; }

/* ==========================================================================
   POPOVER (quick view — Google Calendar style)
   ========================================================================== */
.overlay-click-catcher{
  position:fixed; inset:0; z-index:40;
}
.popover{
  position:absolute;
  z-index:41;
  width:308px;
  background:var(--surface);
  border-radius:var(--radius-lg);
  box-shadow:var(--shadow-lg);
  border:1px solid var(--border);
  overflow:hidden;
  animation:popIn .14s ease;
}
@keyframes popIn{ from{ opacity:0; transform:translateY(4px) scale(.98);} to{opacity:1; transform:none;} }
.popover-bar{ height:6px; }
.popover-body{ padding:16px 18px 14px; }
.popover-title{
  font-family:var(--font-display);
  font-weight:800;
  font-size:15.5px;
  color:var(--text);
  margin:0 0 6px;
  word-break:break-word;
}
.popover-meta{
  display:flex; align-items:center; gap:8px;
  font-size:12.5px; color:var(--text-muted);
  margin-bottom:10px;
}
.popover-detail{
  font-size:12.5px;
  color:var(--text-muted);
  line-height:1.5;
  max-height:80px;
  overflow-y:auto;
  white-space:pre-wrap;
  margin-bottom:10px;
}
.popover-thumbs{ display:flex; gap:6px; margin-bottom:12px; flex-wrap:wrap; }
.popover-thumbs img{ width:44px; height:44px; object-fit:cover; border-radius:6px; border:1px solid var(--border); }
.popover-thumbs .more-thumb{
  width:44px; height:44px; border-radius:6px; background:var(--rigel-navy-050);
  display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; color:var(--rigel-navy);
}
.popover-actions{ display:flex; gap:8px; }
.popover-actions button{ flex:1; }

/* ==========================================================================
   BUTTONS (shared)
   ========================================================================== */
.btn{
  border-radius:8px;
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--text);
  font-size:12.5px;
  font-weight:600;
  padding:8px 12px;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  transition:background .12s ease, border-color .12s ease, transform .1s ease;
}
.btn:hover{ background:var(--rigel-navy-050); border-color:var(--border-strong); }
.btn:active{ transform:scale(.98); }
.btn svg{ width:14px; height:14px; }
.btn-primary{ background:var(--rigel-navy); border-color:var(--rigel-navy); color:#fff; }
.btn-primary:hover{ background:var(--rigel-navy-700); }
.btn-danger{ background:var(--surface); border-color:var(--danger-100); color:var(--danger); }
.btn-danger:hover{ background:var(--danger-100); }
.btn-ghost{ background:transparent; border-color:transparent; }
.btn-ghost:hover{ background:var(--rigel-navy-050); }
.btn-block{ width:100%; }
.btn:disabled{ opacity:.5; cursor:not-allowed; }

/* ==========================================================================
   MODAL (create / edit event)
   ========================================================================== */
.modal-scrim{
  position:fixed; inset:0;
  background:rgba(10,20,45,0.42);
  backdrop-filter:blur(1.5px);
  display:flex;
  align-items:flex-start;
  justify-content:center;
  padding:5vh 16px;
  z-index:60;
  overflow-y:auto;
  animation:fadeIn .15s ease;
}
@keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
.modal{
  width:100%;
  max-width:560px;
  background:var(--surface);
  border-radius:var(--radius-lg);
  box-shadow:var(--shadow-lg);
  overflow:hidden;
  animation:modalIn .18s ease;
}
@keyframes modalIn{ from{opacity:0; transform:translateY(10px) scale(.98);} to{opacity:1; transform:none;} }
.modal-header{
  display:flex; align-items:center; justify-content:space-between;
  padding:18px 22px;
  border-bottom:1px solid var(--border);
}
.modal-header h2{
  font-family:var(--font-display);
  font-size:16.5px;
  margin:0;
  color:var(--rigel-navy-900);
}
.modal-body{ padding:20px 22px 6px; max-height:70vh; overflow-y:auto; }
.modal-footer{
  display:flex; align-items:center; gap:10px;
  padding:16px 22px 20px;
  border-top:1px solid var(--border);
}
.modal-footer .spacer{ flex:1; }

.field{ margin-bottom:16px; }
.field label{
  display:block;
  font-size:12px;
  font-weight:700;
  color:var(--text-muted);
  margin-bottom:6px;
  letter-spacing:.02em;
}
.field input[type=text],
.field input[type=date],
.field input[type=time],
.field input[type=number],
.field select,
.field textarea{
  width:100%;
  border:1px solid var(--border-strong);
  border-radius:8px;
  padding:9px 11px;
  font-size:13.5px;
  color:var(--text);
  background:var(--surface);
  outline:none;
  transition:border-color .12s ease, box-shadow .12s ease;
}
.field input:focus, .field select:focus, .field textarea:focus{
  border-color:var(--rigel-navy);
  box-shadow:0 0 0 3px var(--rigel-navy-100);
}
.field textarea{ resize:vertical; min-height:72px; line-height:1.5; }
.field-row{ display:flex; gap:12px; }
.field-row > .field{ flex:1; min-width:0; }
.field-hint{ font-size:11px; color:var(--text-faint); margin-top:5px; }

.duration-custom-row{ display:flex; gap:8px; margin-top:8px; }
.duration-custom-row input{ flex:1; }
.duration-custom-row select{ width:112px; flex:none; }

.color-row{ display:flex; gap:8px; flex-wrap:wrap; }
.color-swatch{
  width:26px; height:26px; border-radius:50%;
  cursor:pointer; border:2px solid transparent;
  display:flex; align-items:center; justify-content:center;
}
.color-swatch.selected{ border-color:var(--text); }
.color-swatch svg{ width:12px; height:12px; color:#fff; opacity:0; }
.color-swatch.selected svg{ opacity:1; }

.computed-end{
  font-size:12px;
  color:var(--rigel-navy-900);
  background:var(--rigel-navy-050);
  border:1px solid var(--rigel-navy-100);
  border-radius:8px;
  padding:8px 11px;
  display:flex;
  align-items:center;
  gap:7px;
  font-weight:600;
}

/* ---- Image / zip uploader ---- */
.dropzone{
  border:1.5px dashed var(--border-strong);
  border-radius:var(--radius-md);
  padding:22px 14px;
  text-align:center;
  cursor:pointer;
  color:var(--text-muted);
  transition:border-color .12s ease, background .12s ease;
}
.dropzone:hover, .dropzone.drag-over{ border-color:var(--rigel-accent); background:var(--rigel-accent-100); }
.dropzone svg{ width:26px; height:26px; margin-bottom:6px; color:var(--rigel-navy); }
.dropzone .dz-title{ font-weight:700; font-size:13px; color:var(--text); }
.dropzone .dz-sub{ font-size:11.5px; margin-top:2px; }

.thumb-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(72px,1fr));
  gap:8px;
  margin-top:12px;
}
.thumb{
  position:relative;
  border-radius:8px;
  overflow:hidden;
  border:1px solid var(--border);
  aspect-ratio:1/1;
  background:var(--surface-muted);
}
.thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
.thumb .thumb-remove{
  position:absolute; top:3px; right:3px;
  width:19px; height:19px;
  background:rgba(15,20,40,0.65);
  color:#fff;
  border:none;
  border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer;
  font-size:12px;
  line-height:1;
}
.thumb .thumb-remove:hover{ background:var(--danger); }
.thumb .thumb-name{
  position:absolute; left:0; right:0; bottom:0;
  background:linear-gradient(transparent, rgba(0,0,0,0.55));
  color:#fff;
  font-size:9px;
  padding:8px 5px 3px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.upload-toolbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:10px;
}
.upload-toolbar .size-note{ font-size:11px; color:var(--text-faint); }

/* ==========================================================================
   TOASTS
   ========================================================================== */
#toastRoot{
  position:fixed;
  bottom:20px; left:50%;
  transform:translateX(-50%);
  display:flex; flex-direction:column; gap:8px;
  z-index:100;
  align-items:center;
}
.toast{
  background:var(--rigel-navy-900);
  color:#fff;
  padding:10px 18px;
  border-radius:9px;
  font-size:13px;
  font-weight:600;
  box-shadow:var(--shadow-lg);
  animation:toastIn .18s ease;
  display:flex; align-items:center; gap:8px;
}
.toast.error{ background:var(--danger); }
.toast.success{ background:var(--success); }
@keyframes toastIn{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;} }

/* ==========================================================================
   AGENDA (day overflow list) MODAL — reuses .modal-scrim
   ========================================================================== */
.agenda-list{ display:flex; flex-direction:column; gap:8px; }
.agenda-row{
  display:flex; align-items:center; gap:10px;
  padding:9px 10px;
  border-radius:8px;
  border:1px solid var(--border);
  cursor:pointer;
}
.agenda-row:hover{ background:var(--rigel-navy-050); }
.agenda-row .dot{ width:9px; height:9px; border-radius:50%; flex:none; }
.agenda-row .ar-time{ font-size:11.5px; color:var(--text-muted); font-weight:600; width:64px; flex:none; }
.agenda-row .ar-name{ font-weight:600; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

/* ==========================================================================
   EMPTY / LOADING
   ========================================================================== */
.loading-screen{
  position:fixed; inset:0;
  display:flex; align-items:center; justify-content:center;
  flex-direction:column; gap:14px;
  background:var(--rigel-navy);
  color:#fff;
  z-index:200;
}
.loading-screen img{ height:44px; }
.spinner{
  width:26px; height:26px;
  border-radius:50%;
  border:3px solid rgba(255,255,255,0.25);
  border-top-color:var(--rigel-accent);
  animation:spin .8s linear infinite;
}
@keyframes spin{ to{ transform:rotate(360deg); } }

/* ==========================================================================
   RESPONSIVE
   ========================================================================== */
@media (max-width: 860px){
  .sidebar{ display:none; }
  .month-cell{ min-height:84px; }
  .current-label{ font-size:15px; }
}
</style>
</head>

<script>
/* ============================================================================
   RIGEL LED · CONTENT CALENDAR — APPLICATION SCRIPT
   ----------------------------------------------------------------------------
   HOW THIS FILE IS ORGANISED (read this before editing)

   The app is split into small, independent MODULES, each in its own labelled
   section below. A module only talks to another module through the small
   set of functions it exposes on its namespace object (e.g. Store.*, State.*).
   This keeps the app "future proof": you can add or remove a module, a field
   on the Event object, or a whole view (e.g. "Year view") without having to
   rewrite unrelated code.

   MODULE MAP
   -----------------------------------------------------------------
    1. CONFIG          static configuration & constants
    2. UTIL            small stateless helper functions
    3. STORE           the ONLY place that talks to Firestore
                       (persistence / live-sync layer)
    4. STATE           in-memory application state + change notification
    5. DATE ENGINE     calendar math, framework-agnostic
    6. IMAGE / ZIP     everything to do with reading & writing image files
                       and .zip archives (uses JSZip, loaded via CDN)
    7. RENDER: SHELL   topbar, sidebar legend, view switching
    8. RENDER: MONTH   month grid view
    9. RENDER: WEEK    week time-grid view
   10. RENDER: DAY     day time-grid view
   11. POPOVER         Google-Calendar-style quick view bubble
   12. EVENT MODAL     create / edit form
   13. AGENDA MODAL    "+N more" day overflow list
   14. BOOTSTRAP       wires everything together and starts the app

   EXTENDING THE EVENT SCHEMA (future-proofing notes)
   -----------------------------------------------------------------
   Every event object carries a `schemaVersion`. If you need to add a new
   field in the future:
     1. Add it to CONFIG.EVENT_DEFAULTS (so old events still get a sane value)
     2. Add a form control for it inside the EVENT MODAL module
     3. Add a rendering hook wherever it should be displayed (chip / popover)
   Unknown/legacy fields are preserved automatically because Store.saveEvent
   merges into the full stored object rather than replacing it wholesale.
   ============================================================================ */


/* ============================================================================
   1. CONFIG
   ============================================================================ */
const CONFIG = {
  APP_NAME: "RIGEL LED",
  APP_SUBTITLE: "Content Calendar",

  // Storage keys ---------------------------------------------------------
  // Kept in one place so the persistence "schema" is easy to audit.
  STORAGE_KEYS: {
    EVENT_INDEX: "rigel:events:index",      // lightweight summaries, shared
    EVENT_FULL:  (id) => `rigel:event:${id}` // full record incl. images, shared
  },

  // All calendar data is intentionally SHARED so that everyone who opens
  // this artifact sees the same live-synced content calendar.
  SHARED: true,

  // How often (ms) to poll for changes made by other people/tabs.
  POLL_INTERVAL_MS: 8000,

  WEEK_STARTS_ON: 0, // 0 = Sunday, 1 = Monday
  DAY_START_HOUR: 0,
  DAY_END_HOUR: 24,
  HOUR_HEIGHT_PX: 56,

  // Duration presets shown in the <select>. `minutes: null` marks the
  // "Custom" option which reveals the free-entry inputs.
  DURATION_PRESETS: [
    { label: "15 minutes", minutes: 15 },
    { label: "30 minutes", minutes: 30 },
    { label: "45 minutes", minutes: 45 },
    { label: "1 hour",     minutes: 60 },
    { label: "2 hours",    minutes: 120 },
    { label: "4 hours",    minutes: 240 },
    { label: "Half day (4h)", minutes: 240 },
    { label: "Full day (24h)", minutes: 1440 },
    { label: "Custom…",    minutes: null }
  ],

  CUSTOM_DURATION_UNITS: [
    { label: "minutes", mult: 1 },
    { label: "hours",   mult: 60 },
    { label: "days",    mult: 1440 }
  ],

  COLOR_TAGS: [
    { id: "navy",   value: "#12357f", label: "General" },
    { id: "blue",   value: "#3b7ddb", label: "Social" },
    { id: "teal",   value: "#17b3a3", label: "Web / Digital" },
    { id: "violet", value: "#7b6bd6", label: "Campaign" },
    { id: "amber",  value: "#d99a2b", label: "Promo" },
    { id: "rose",   value: "#d6537b", label: "Event" },
    { id: "slate",  value: "#5b6b8c", label: "Internal" }
  ],

  // Defaults applied to any event object read from storage so that new
  // fields added later never break rendering of older records.
  EVENT_DEFAULTS: {
    schemaVersion: 1,
    name: "Untitled upload",
    detail: "",
    durationLabel: "30 minutes",
    colorTag: "navy",
    status: "scheduled",
    images: [],
    customFields: {} // reserved bucket for future extensions
  },

  MAX_EVENT_PAYLOAD_BYTES: 0.85 * 1024 * 1024, // soft cap — Firestore's hard cap per document is 1MB
  IMAGE_MAX_DIMENSION: 1600,
  IMAGE_JPEG_QUALITY: 0.82,

  ACCEPTED_IMAGE_EXT: ["png","jpg","jpeg","gif","webp","bmp","svg"]
};

/* ============================================================================
   1b. FIREBASE CONFIG — paste your own project's values here
   ----------------------------------------------------------------------------
   Get these from: Firebase console → Project settings → your web app →
   "SDK setup and configuration" → Config. Every value below is a placeholder
   and MUST be replaced or the calendar cannot save/load data.
   ============================================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyCJ2nSprYvXUGsoh1CX6B7kOYLqo9QVwwM",
  authDomain: "rigel-mobilecalendar.firebaseapp.com",
  projectId: "rigel-mobilecalendar",
  storageBucket: "rigel-mobilecalendar.firebasestorage.app",
  messagingSenderId: "985973453894",
  appId: "1:985973453894:web:ae22a9eeb8de2f8ac6c647"
};

// Firestore collection that all calendar data lives in.
const FIRESTORE_COLLECTION = "rigelCalendarData";

let _db = null;
let _firebaseReady = false;
try{
  if (FIREBASE_CONFIG.apiKey && !FIREBASE_CONFIG.apiKey.startsWith("PASTE_")){
    firebase.initializeApp(FIREBASE_CONFIG);
    _db = firebase.firestore();
    _firebaseReady = true;
  }
}catch(e){
  console.error("Firebase init failed", e);
  _firebaseReady = false;
}


/* ============================================================================
   2. UTIL — small stateless helpers used across modules
   ============================================================================ */
const Util = {
  uuid(){
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, c => {
      const r = Math.random()*16|0, v = c === "x" ? r : (r&0x3|0x8);
      return v.toString(16);
    });
  },

  escapeHtml(str){
    if (str === null || str === undefined) return "";
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  },

  clamp(n, min, max){ return Math.max(min, Math.min(max, n)); },

  pad2(n){ return String(n).padStart(2, "0"); },

  // "2026-08-20T14:30" style local-time key, used for <input type=date/time>
  toDateInputValue(d){
    return `${d.getFullYear()}-${Util.pad2(d.getMonth()+1)}-${Util.pad2(d.getDate())}`;
  },
  toTimeInputValue(d){
    return `${Util.pad2(d.getHours())}:${Util.pad2(d.getMinutes())}`;
  },
  parseDateTimeInputs(dateStr, timeStr){
    const [y,mo,da] = dateStr.split("-").map(Number);
    const [h,mi] = (timeStr || "00:00").split(":").map(Number);
    return new Date(y, mo-1, da, h, mi, 0, 0);
  },

  formatDayLabel(d){
    return d.toLocaleDateString(undefined, { weekday:"short", month:"short", day:"numeric" });
  },
  formatMonthYear(d){
    return d.toLocaleDateString(undefined, { month:"long", year:"numeric" });
  },
  formatTimeShort(d){
    return d.toLocaleTimeString(undefined, { hour:"numeric", minute:"2-digit" });
  },
  formatTimeRange(start, end){
    return `${Util.formatTimeShort(start)} – ${Util.formatTimeShort(end)}`;
  },

  formatBytes(bytes){
    if (bytes < 1024) return bytes + " B";
    if (bytes < 1024*1024) return (bytes/1024).toFixed(1) + " KB";
    return (bytes/(1024*1024)).toFixed(2) + " MB";
  },

  base64Size(dataUrl){
    const comma = dataUrl.indexOf(",");
    const b64 = comma >= 0 ? dataUrl.slice(comma+1) : dataUrl;
    // approximate decoded byte length of a base64 string
    return Math.floor(b64.length * 0.75);
  },

  isSameDay(a, b){
    return a.getFullYear() === b.getFullYear() &&
           a.getMonth() === b.getMonth() &&
           a.getDate() === b.getDate();
  },

  addDays(d, n){ const r = new Date(d); r.setDate(r.getDate()+n); return r; },
  addMinutes(d, n){ const r = new Date(d); r.setMinutes(r.getMinutes()+n); return r; },

  debounce(fn, ms){
    let t;
    return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
  },

  colorForTag(tagId){
    const found = CONFIG.COLOR_TAGS.find(c => c.id === tagId);
    return found ? found.value : CONFIG.COLOR_TAGS[0].value;
  },

  labelForTag(tagId){
    const found = CONFIG.COLOR_TAGS.find(c => c.id === tagId);
    return found ? found.label : "General";
  }
};


/* ============================================================================
   3. STORE — the ONLY module that talks to Firestore
   ----------------------------------------------------------------------------
   Every read/write for calendar data funnels through here. If the storage
   API ever changes, this is the single place to update.
   ============================================================================ */
const Store = {
  // Firestore doc IDs can't contain "/" — our keys never do, but this keeps
  // things safe if that ever changes.
  _docId(key){ return key.replace(/\//g, "__"); },

  async _get(key){
    try{
      if (!_firebaseReady) return null;
      const snap = await _db.collection(FIRESTORE_COLLECTION).doc(Store._docId(key)).get();
      return snap.exists ? snap.data().value : null;
    }catch(e){
      console.error("Store read failed for", key, e);
      return null; // key not found or storage unavailable
    }
  },
  async _set(key, value){
    try{
      if (!_firebaseReady) return false;
      await _db.collection(FIRESTORE_COLLECTION).doc(Store._docId(key)).set({ value });
      return true;
    }catch(e){
      console.error("Store write failed for", key, e);
      return false;
    }
  },
  async _delete(key){
    try{
      if (!_firebaseReady) return false;
      await _db.collection(FIRESTORE_COLLECTION).doc(Store._docId(key)).delete();
      return true;
    }catch(e){
      return false;
    }
  },

  /** Returns an array of lightweight event summaries. Never throws. */
  async getIndex(){
    const raw = await Store._get(CONFIG.STORAGE_KEYS.EVENT_INDEX);
    if (!raw) return [];
    try{
      const list = JSON.parse(raw);
      return Array.isArray(list) ? list : [];
    }catch(e){
      return [];
    }
  },

  async _saveIndex(list){
    return Store._set(CONFIG.STORAGE_KEYS.EVENT_INDEX, JSON.stringify(list));
  },

  /** Fetches one full event record (detail + images), applying schema defaults. */
  async getEvent(id){
    const raw = await Store._get(CONFIG.STORAGE_KEYS.EVENT_FULL(id));
    if (!raw) return null;
    try{
      const parsed = JSON.parse(raw);
      return Object.assign({}, CONFIG.EVENT_DEFAULTS, parsed);
    }catch(e){
      return null;
    }
  },

  /**
   * Saves a full event object (create or update) and refreshes its
   * lightweight entry in the shared index.
   */
  async saveEvent(fullEvent){
    fullEvent.updatedAt = new Date().toISOString();
    if (!fullEvent.createdAt) fullEvent.createdAt = fullEvent.updatedAt;
    if (!fullEvent.schemaVersion) fullEvent.schemaVersion = CONFIG.EVENT_DEFAULTS.schemaVersion;

    const payload = JSON.stringify(fullEvent);
    const okFull = await Store._set(CONFIG.STORAGE_KEYS.EVENT_FULL(fullEvent.id), payload);
    if (!okFull) return false;

    const index = await Store.getIndex();
    const summary = {
      id: fullEvent.id,
      name: fullEvent.name,
      start: fullEvent.start,
      end: fullEvent.end,
      durationLabel: fullEvent.durationLabel,
      colorTag: fullEvent.colorTag,
      hasImages: (fullEvent.images || []).length > 0,
      imageCount: (fullEvent.images || []).length,
      updatedAt: fullEvent.updatedAt
    };
    const idx = index.findIndex(e => e.id === fullEvent.id);
    if (idx >= 0) index[idx] = summary; else index.push(summary);
    await Store._saveIndex(index);
    return true;
  },

  async deleteEvent(id){
    await Store._delete(CONFIG.STORAGE_KEYS.EVENT_FULL(id));
    const index = await Store.getIndex();
    await Store._saveIndex(index.filter(e => e.id !== id));
    return true;
  }
};
/* ============================================================================
   4. STATE — in-memory application state + a tiny pub/sub for re-rendering
   ============================================================================ */
const State = {
  currentView: "month",   // "day" | "week" | "month"
  currentDate: new Date(),
  index: [],              // array of event summaries (from Store.getIndex)
  fullCache: {},          // id -> full event object, populated lazily
  openPopoverId: null,
  lastIndexSignature: "",

  _listeners: [],
  onChange(fn){ State._listeners.push(fn); },
  notify(){ State._listeners.forEach(fn => fn()); },

  setView(view){ State.currentView = view; State.notify(); },
  setDate(d){ State.currentDate = d; State.notify(); },

  eventsForDay(day){
    return State.index
      .filter(e => Util.isSameDay(new Date(e.start), day))
      .sort((a,b) => new Date(a.start) - new Date(b.start));
  },

  async refreshIndex(){
    const list = await Store.getIndex();
    const sig = JSON.stringify(list.map(e => e.id + e.updatedAt));
    if (sig !== State.lastIndexSignature){
      State.lastIndexSignature = sig;
      State.index = list;
      State.notify();
    }
  },

  async getFullEvent(id, forceReload){
    if (!forceReload && State.fullCache[id]) return State.fullCache[id];
    const ev = await Store.getEvent(id);
    if (ev) State.fullCache[id] = ev;
    return ev;
  },

  invalidate(id){ delete State.fullCache[id]; }
};


/* ============================================================================
   5. DATE ENGINE — pure calendar math, no DOM / no rendering
   ============================================================================ */
const DateEngine = {
  startOfDay(d){ const r = new Date(d); r.setHours(0,0,0,0); return r; },

  startOfWeek(d){
    const r = DateEngine.startOfDay(d);
    const diff = (r.getDay() - CONFIG.WEEK_STARTS_ON + 7) % 7;
    r.setDate(r.getDate() - diff);
    return r;
  },

  startOfMonth(d){ return new Date(d.getFullYear(), d.getMonth(), 1); },

  /** Returns a flat array of 42 Date objects (6 weeks) for the month grid. */
  monthGridDays(d){
    const firstOfMonth = DateEngine.startOfMonth(d);
    const gridStart = DateEngine.startOfWeek(firstOfMonth);
    const days = [];
    for (let i=0;i<42;i++) days.push(Util.addDays(gridStart, i));
    return days;
  },

  weekDays(d){
    const start = DateEngine.startOfWeek(d);
    const days = [];
    for (let i=0;i<7;i++) days.push(Util.addDays(start, i));
    return days;
  },

  isCurrentMonth(day, refDate){ return day.getMonth() === refDate.getMonth(); }
};


/* ============================================================================
   6. IMAGE / ZIP — reading uploaded images / zips, and building zips to export
   ----------------------------------------------------------------------------
   Images are stored as compressed base64 data-URIs directly on the event
   object (see Store). Keeping this logic isolated means the storage/rendering
   layers never need to know *how* an image got there.
   ============================================================================ */
const ImageZip = {
  /** Downscale + compress an image dataURL via <canvas> to control storage size. */
  compressDataUrl(dataUrl, mimeType){
    return new Promise((resolve) => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        const max = CONFIG.IMAGE_MAX_DIMENSION;
        if (width > max || height > max){
          const scale = Math.min(max/width, max/height);
          width = Math.round(width*scale);
          height = Math.round(height*scale);
        }
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);
        const keepPng = mimeType === "image/png" || mimeType === "image/gif" || mimeType === "image/svg+xml";
        const outType = keepPng ? "image/png" : "image/jpeg";
        const out = canvas.toDataURL(outType, CONFIG.IMAGE_JPEG_QUALITY);
        resolve(out);
      };
      img.onerror = () => resolve(dataUrl); // fall back to original if it fails to decode
      img.src = dataUrl;
    });
  },

  fileToDataUrl(file){
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(r.result);
      r.onerror = reject;
      r.readAsDataURL(file);
    });
  },

  extOf(filename){
    const m = /\.([a-z0-9]+)$/i.exec(filename || "");
    return m ? m[1].toLowerCase() : "";
  },

  mimeForExt(ext){
    const map = { jpg:"image/jpeg", jpeg:"image/jpeg", png:"image/png", gif:"image/gif", webp:"image/webp", bmp:"image/bmp", svg:"image/svg+xml" };
    return map[ext] || "application/octet-stream";
  },

  /**
   * Accepts a FileList (from an <input type=file> or a drop event) which may
   * contain plain image files and/or .zip archives. Returns an array of
   * { id, filename, mimeType, dataUrl } ready to attach to an event.
   */
  async processIncomingFiles(fileList, onProgress){
    const out = [];
    const files = Array.from(fileList);

    for (const file of files){
      const ext = ImageZip.extOf(file.name);

      if (ext === "zip"){
        try{
          const zip = await JSZip.loadAsync(file);
          const entries = Object.values(zip.files).filter(f => !f.dir && CONFIG.ACCEPTED_IMAGE_EXT.includes(ImageZip.extOf(f.name)));
          for (const entry of entries){
            if (onProgress) onProgress(`Extracting ${entry.name}…`);
            const base64 = await entry.async("base64");
            const mimeType = ImageZip.mimeForExt(ImageZip.extOf(entry.name));
            const rawDataUrl = `data:${mimeType};base64,${base64}`;
            const compact = await ImageZip.compressDataUrl(rawDataUrl, mimeType);
            out.push({
              id: Util.uuid(),
              filename: entry.name.split("/").pop(),
              mimeType: compact.startsWith("data:image/png") ? "image/png" : "image/jpeg",
              dataUrl: compact
            });
          }
        }catch(e){
          console.error("Failed to read zip", file.name, e);
          Toast.show(`Couldn't read ${file.name} as a zip file.`, "error");
        }
      } else if (CONFIG.ACCEPTED_IMAGE_EXT.includes(ext)){
        if (onProgress) onProgress(`Reading ${file.name}…`);
        try{
          const rawDataUrl = await ImageZip.fileToDataUrl(file);
          const compact = await ImageZip.compressDataUrl(rawDataUrl, file.type || ImageZip.mimeForExt(ext));
          out.push({
            id: Util.uuid(),
            filename: file.name,
            mimeType: compact.startsWith("data:image/png") ? "image/png" : "image/jpeg",
            dataUrl: compact
          });
        }catch(e){
          console.error("Failed to read image", file.name, e);
        }
      }
      // silently ignore any other file type
    }
    return out;
  },

  /** Builds a .zip from an array of {filename, dataUrl} and triggers a download. */
  async downloadAsZip(images, zipBaseName){
    if (!images || images.length === 0) return;
    const zip = new JSZip();
    const usedNames = new Set();

    images.forEach((img) => {
      let name = img.filename || `image-${img.id}.jpg`;
      if (usedNames.has(name)){
        const dot = name.lastIndexOf(".");
        const stem = dot >= 0 ? name.slice(0,dot) : name;
        const extPart = dot >= 0 ? name.slice(dot) : "";
        name = `${stem}-${img.id.slice(0,6)}${extPart}`;
      }
      usedNames.add(name);
      const comma = img.dataUrl.indexOf(",");
      const base64 = img.dataUrl.slice(comma+1);
      zip.file(name, base64, { base64:true });
    });

    const blob = await zip.generateAsync({ type:"blob" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `${(zipBaseName || "rigel-event").replace(/[^a-z0-9\-_]+/gi,"_")}.zip`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  },

  totalBytes(images){
    return (images||[]).reduce((sum,img) => sum + Util.base64Size(img.dataUrl), 0);
  }
};


/* ============================================================================
   TOAST — tiny notification helper (used by several modules)
   ============================================================================ */
const Toast = {
  show(message, kind){
    const root = document.getElementById("toastRoot");
    const el = document.createElement("div");
    el.className = "toast" + (kind ? " " + kind : "");
    el.textContent = message;
    root.appendChild(el);
    setTimeout(() => {
      el.style.transition = "opacity .25s ease";
      el.style.opacity = "0";
      setTimeout(() => el.remove(), 260);
    }, 2600);
  }
};
/* ============================================================================
   7. RENDER: SHELL — topbar label, view-switch buttons, sidebar legend
   ============================================================================ */
const Shell = {
  init(){
    document.getElementById("btnPrev").addEventListener("click", () => Shell.step(-1));
    document.getElementById("btnNext").addEventListener("click", () => Shell.step(1));
    document.getElementById("btnToday").addEventListener("click", () => State.setDate(new Date()));
    document.getElementById("btnNewEvent").addEventListener("click", () => EventModal.openForCreate());

    document.getElementById("viewSwitch").addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-view]");
      if (!btn) return;
      State.setView(btn.dataset.view);
    });

    Shell.renderLegend();
  },

  step(dir){
    const d = new Date(State.currentDate);
    if (State.currentView === "month") d.setMonth(d.getMonth()+dir);
    else if (State.currentView === "week") d.setDate(d.getDate()+dir*7);
    else d.setDate(d.getDate()+dir);
    State.setDate(d);
  },

  renderLegend(){
    const root = document.getElementById("legendList");
    root.innerHTML = CONFIG.COLOR_TAGS.map(tag => `
      <div class="legend-item">
        <span class="legend-dot" style="background:${tag.value}"></span>${Util.escapeHtml(tag.label)}
      </div>
    `).join("");
  },

  renderLabel(){
    const el = document.getElementById("currentLabel");
    if (State.currentView === "month"){
      el.textContent = Util.formatMonthYear(State.currentDate);
    } else if (State.currentView === "week"){
      const days = DateEngine.weekDays(State.currentDate);
      const first = days[0], last = days[6];
      const sameMonth = first.getMonth() === last.getMonth();
      el.textContent = sameMonth
        ? `${first.toLocaleDateString(undefined,{month:"short"})} ${first.getDate()}–${last.getDate()}, ${last.getFullYear()}`
        : `${first.toLocaleDateString(undefined,{month:"short",day:"numeric"})} – ${last.toLocaleDateString(undefined,{month:"short",day:"numeric"})}, ${last.getFullYear()}`;
    } else {
      el.textContent = State.currentDate.toLocaleDateString(undefined, { weekday:"long", month:"long", day:"numeric", year:"numeric" });
    }

    document.querySelectorAll("#viewSwitch button").forEach(b => {
      b.classList.toggle("active", b.dataset.view === State.currentView);
    });
  },

  render(){
    Shell.renderLabel();
    const container = document.getElementById("viewContainer");
    container.innerHTML = "";
    if (State.currentView === "month") MonthView.render(container);
    else if (State.currentView === "week") TimeGridView.render(container, DateEngine.weekDays(State.currentDate));
    else TimeGridView.render(container, [DateEngine.startOfDay(State.currentDate)]);
  }
};


/* ============================================================================
   8. RENDER: MONTH VIEW
   ============================================================================ */
const MonthView = {
  MAX_CHIPS_PER_CELL: 3,

  render(container){
    const days = DateEngine.monthGridDays(State.currentDate);
    const today = new Date();

    const wrap = document.createElement("div");

    const weekdayRow = document.createElement("div");
    weekdayRow.className = "month-weekday-row";
    const dowNames = [];
    for (let i=0;i<7;i++){
      const d = Util.addDays(DateEngine.startOfWeek(new Date()), i);
      dowNames.push(d.toLocaleDateString(undefined,{ weekday:"short" }));
    }
    weekdayRow.innerHTML = dowNames.map(n => `<div>${n}</div>`).join("");
    wrap.appendChild(weekdayRow);

    const grid = document.createElement("div");
    grid.className = "month-grid";

    days.forEach(day => {
      const cell = document.createElement("div");
      cell.className = "month-cell" + (DateEngine.isCurrentMonth(day, State.currentDate) ? "" : " outside");

      const isToday = Util.isSameDay(day, today);
      const dayEvents = State.eventsForDay(day);
      const visible = dayEvents.slice(0, MonthView.MAX_CHIPS_PER_CELL);
      const overflowCount = dayEvents.length - visible.length;

      cell.innerHTML = `
        <div class="date-num-row">
          <div class="date-num ${isToday ? "is-today" : ""}" data-goto-day="${day.toISOString()}">${day.getDate()}</div>
        </div>
        <div class="event-list">
          ${visible.map(ev => MonthView.chipHtml(ev)).join("")}
          ${overflowCount > 0 ? `<div class="more-link" data-agenda-day="${day.toISOString()}">+${overflowCount} more</div>` : ""}
        </div>
      `;

      grid.appendChild(cell);
    });

    wrap.appendChild(grid);
    container.appendChild(wrap);

    // Event delegation for this render pass
    grid.querySelectorAll("[data-goto-day]").forEach(el => {
      el.addEventListener("click", () => {
        State.setDate(new Date(el.dataset.gotoDay));
        State.setView("day");
      });
    });
    grid.querySelectorAll(".event-chip").forEach(el => {
      el.addEventListener("click", (e) => {
        e.stopPropagation();
        Popover.open(el.dataset.eventId, el);
      });
    });
    grid.querySelectorAll("[data-agenda-day]").forEach(el => {
      el.addEventListener("click", (e) => {
        e.stopPropagation();
        AgendaModal.open(new Date(el.dataset.agendaDay));
      });
    });
  },

  chipHtml(ev){
    const color = Util.colorForTag(ev.colorTag);
    const start = new Date(ev.start);
    return `
      <div class="event-chip" data-event-id="${ev.id}" style="border-left-color:${color}">
        <span class="chip-time">${Util.formatTimeShort(start)}</span>
        <span class="chip-name">${Util.escapeHtml(ev.name)}</span>
      </div>
    `;
  }
};


/* ============================================================================
   9 & 10. RENDER: TIME GRID (shared engine for Week + Day views)
   ============================================================================ */
const TimeGridView = {
  render(container, days){
    const today = new Date();
    const wrap = document.createElement("div");
    wrap.className = "time-grid-wrap";

    // ---- header row ----
    const header = document.createElement("div");
    header.className = "time-header-row";
    header.innerHTML = `<div class="time-gutter-spacer"></div>` + days.map(d => `
      <div class="time-header-col ${Util.isSameDay(d,today) ? "is-today" : ""}">
        <div class="dow">${d.toLocaleDateString(undefined,{weekday:"short"})}</div>
        <div class="dnum">${d.getDate()}</div>
      </div>
    `).join("");
    wrap.appendChild(header);

    // ---- scrollable body ----
    const body = document.createElement("div");
    body.className = "time-body";

    const gutter = document.createElement("div");
    gutter.className = "time-gutter";
    gutter.style.height = (24 * CONFIG.HOUR_HEIGHT_PX) + "px";
    for (let h=0; h<24; h++){
      const lbl = document.createElement("div");
      lbl.className = "hour-label";
      lbl.style.top = (h * CONFIG.HOUR_HEIGHT_PX) + "px";
      lbl.textContent = h === 0 ? "" : new Date(2000,0,1,h).toLocaleTimeString(undefined,{hour:"numeric"});
      gutter.appendChild(lbl);
    }
    body.appendChild(gutter);

    const columns = document.createElement("div");
    columns.className = "time-columns";
    columns.style.height = (24 * CONFIG.HOUR_HEIGHT_PX) + "px";

    days.forEach(day => {
      const col = document.createElement("div");
      col.className = "time-col";
      for (let h=0; h<24; h++){
        const line = document.createElement("div");
        line.className = "hour-line";
        line.style.top = (h * CONFIG.HOUR_HEIGHT_PX) + "px";
        col.appendChild(line);
      }

      if (Util.isSameDay(day, today)){
        const nowLine = document.createElement("div");
        nowLine.className = "now-line";
        const minutesNow = today.getHours()*60 + today.getMinutes();
        nowLine.style.top = (minutesNow/60 * CONFIG.HOUR_HEIGHT_PX) + "px";
        col.appendChild(nowLine);
      }

      const dayEvents = State.eventsForDay(day);
      dayEvents.forEach(ev => {
        const start = new Date(ev.start);
        const end = new Date(ev.end);
        const startMin = Util.clamp(start.getHours()*60 + start.getMinutes(), 0, 1440);
        let endMin = end.getHours()*60 + end.getMinutes();
        if (end <= start || (!Util.isSameDay(end,start) && endMin < startMin)) endMin = 1440;
        endMin = Util.clamp(endMin, startMin+20, 1440);

        const block = document.createElement("div");
        block.className = "time-event";
        block.dataset.eventId = ev.id;
        block.style.top = (startMin/60 * CONFIG.HOUR_HEIGHT_PX) + "px";
        block.style.height = Math.max(22, (endMin-startMin)/60 * CONFIG.HOUR_HEIGHT_PX - 2) + "px";
        block.style.background = Util.colorForTag(ev.colorTag);
        block.innerHTML = `<span class="te-name">${Util.escapeHtml(ev.name)}</span><span class="te-time">${Util.formatTimeShort(start)}</span>`;
        block.addEventListener("click", (e) => { e.stopPropagation(); Popover.open(ev.id, block); });
        col.appendChild(block);
      });

      columns.appendChild(col);
    });

    body.appendChild(columns);
    wrap.appendChild(body);
    container.appendChild(wrap);

    // Scroll to ~7am by default for a friendlier initial view
    requestAnimationFrame(() => { body.scrollTop = 7 * CONFIG.HOUR_HEIGHT_PX; });
  }
};
/* ============================================================================
   11. POPOVER — Google-Calendar-style quick view bubble for a single event
   ============================================================================ */
const Popover = {
  async open(eventId, anchorEl){
    Popover.close();
    const summary = State.index.find(e => e.id === eventId);
    if (!summary) return;

    const catcher = document.createElement("div");
    catcher.className = "overlay-click-catcher";
    catcher.addEventListener("click", Popover.close);

    const pop = document.createElement("div");
    pop.className = "popover";
    pop.innerHTML = `<div class="popover-bar" style="background:${Util.colorForTag(summary.colorTag)}"></div>
      <div class="popover-body"><div style="font-size:12px;color:var(--text-faint)">Loading…</div></div>`;
    pop.addEventListener("click", (e) => e.stopPropagation());

    document.getElementById("modalRoot").appendChild(catcher);
    document.getElementById("modalRoot").appendChild(pop);
    Popover._position(pop, anchorEl);

    const full = await State.getFullEvent(eventId);
    if (!full || !document.body.contains(pop)) return;

    const start = new Date(full.start), end = new Date(full.end);
    const images = full.images || [];
    const shownThumbs = images.slice(0,3);
    const extra = images.length - shownThumbs.length;

    pop.querySelector(".popover-body").innerHTML = `
      <div class="popover-title">${Util.escapeHtml(full.name)}</div>
      <div class="popover-meta">
        <span>${Util.formatDayLabel(start)} · ${Util.formatTimeRange(start,end)}</span>
      </div>
      <div class="popover-meta" style="margin-top:-6px;">
        <span class="legend-dot" style="background:${Util.colorForTag(full.colorTag)}"></span>
        ${Util.escapeHtml(Util.labelForTag(full.colorTag))} · ${Util.escapeHtml(full.durationLabel || "")}
      </div>
      ${full.detail ? `<div class="popover-detail">${Util.escapeHtml(full.detail)}</div>` : ""}
      ${images.length ? `<div class="popover-thumbs">
          ${shownThumbs.map(im => `<img src="${im.dataUrl}" alt="${Util.escapeHtml(im.filename)}"/>`).join("")}
          ${extra > 0 ? `<div class="more-thumb">+${extra}</div>` : ""}
        </div>` : ""}
      <div class="popover-actions">
        <button class="btn" id="popEdit">Edit</button>
        ${images.length ? `<button class="btn" id="popZip">Download zip</button>` : ""}
        <button class="btn btn-danger" id="popDelete">Delete</button>
      </div>
    `;

    pop.querySelector("#popEdit").addEventListener("click", () => { Popover.close(); EventModal.openForEdit(full.id); });
    pop.querySelector("#popDelete").addEventListener("click", () => Popover.confirmDelete(full));
    const zipBtn = pop.querySelector("#popZip");
    if (zipBtn) zipBtn.addEventListener("click", () => ImageZip.downloadAsZip(full.images, full.name));

    Popover._position(pop, anchorEl);
    State.openPopoverId = eventId;
  },

  _position(pop, anchorEl){
    const rect = anchorEl.getBoundingClientRect();
    const popW = 308;
    let left = rect.left + window.scrollX;
    let top = rect.bottom + window.scrollY + 6;
    if (left + popW > window.innerWidth - 12) left = window.innerWidth - popW - 12;
    if (top + 260 > window.innerHeight + window.scrollY) top = rect.top + window.scrollY - 266;
    pop.style.left = Math.max(8,left) + "px";
    pop.style.top = Math.max(8,top) + "px";
  },

  confirmDelete(full){
    ConfirmDialog.open({
      title: "Delete this upload?",
      body: `"${full.name}" will be permanently removed for everyone.`,
      confirmLabel: "Delete",
      danger: true,
      onConfirm: async () => {
        await Store.deleteEvent(full.id);
        State.invalidate(full.id);
        await State.refreshIndex();
        Popover.close();
        Toast.show("Upload deleted", "success");
      }
    });
  },

  close(){
    document.getElementById("modalRoot").querySelectorAll(".overlay-click-catcher, .popover").forEach(el => {
      if (!el.classList.contains("modal-scrim")) el.remove();
    });
    State.openPopoverId = null;
  }
};


/* ============================================================================
   AGENDA MODAL — shown when clicking "+N more" in a crowded month cell
   ============================================================================ */
const AgendaModal = {
  open(day){
    const dayEvents = State.eventsForDay(day);
    const scrim = document.createElement("div");
    scrim.className = "modal-scrim";
    scrim.addEventListener("click", (e) => { if (e.target === scrim) AgendaModal.close(); });

    scrim.innerHTML = `
      <div class="modal" style="max-width:420px;">
        <div class="modal-header">
          <h2>${Util.formatDayLabel(day)}</h2>
          <button class="icon-btn" id="agendaClose">✕</button>
        </div>
        <div class="modal-body" style="padding-bottom:18px;">
          <div class="agenda-list">
            ${dayEvents.map(ev => `
              <div class="agenda-row" data-event-id="${ev.id}">
                <span class="dot" style="background:${Util.colorForTag(ev.colorTag)}"></span>
                <span class="ar-time">${Util.formatTimeShort(new Date(ev.start))}</span>
                <span class="ar-name">${Util.escapeHtml(ev.name)}</span>
              </div>
            `).join("") || `<div style="font-size:13px;color:var(--text-muted)">Nothing scheduled.</div>`}
          </div>
        </div>
      </div>
    `;
    document.getElementById("modalRoot").appendChild(scrim);
    scrim.querySelector("#agendaClose").addEventListener("click", AgendaModal.close);
    scrim.querySelectorAll(".agenda-row").forEach(row => {
      row.addEventListener("click", () => {
        AgendaModal.close();
        EventModal.openForEdit(row.dataset.eventId);
      });
    });
  },
  close(){
    document.getElementById("modalRoot").querySelectorAll(".modal-scrim").forEach(el => el.remove());
  }
};


/* ============================================================================
   CONFIRM DIALOG — small reusable yes/no dialog (delete confirmations etc.)
   ============================================================================ */
const ConfirmDialog = {
  open({ title, body, confirmLabel, danger, onConfirm }){
    const scrim = document.createElement("div");
    scrim.className = "modal-scrim";
    scrim.innerHTML = `
      <div class="modal" style="max-width:380px;">
        <div class="modal-header"><h2>${Util.escapeHtml(title)}</h2></div>
        <div class="modal-body" style="padding-bottom:4px;">
          <p style="font-size:13.5px;color:var(--text-muted);line-height:1.5;margin:0 0 4px;">${Util.escapeHtml(body)}</p>
        </div>
        <div class="modal-footer">
          <div class="spacer"></div>
          <button class="btn" id="cdCancel">Cancel</button>
          <button class="btn ${danger ? "btn-danger" : "btn-primary"}" id="cdConfirm">${Util.escapeHtml(confirmLabel)}</button>
        </div>
      </div>
    `;
    document.getElementById("modalRoot").appendChild(scrim);
    const close = () => scrim.remove();
    scrim.addEventListener("click", (e) => { if (e.target === scrim) close(); });
    scrim.querySelector("#cdCancel").addEventListener("click", close);
    scrim.querySelector("#cdConfirm").addEventListener("click", async () => { close(); await onConfirm(); });
  }
};
/* ============================================================================
   12. EVENT MODAL — create / edit form
   ----------------------------------------------------------------------------
   Holds its own small piece of local state (the in-progress form) separate
   from the global State module, since a draft shouldn't affect the calendar
   until "Save" is pressed.
   ============================================================================ */
const EventModal = {
  _editingId: null,
  _images: [],
  _scrimEl: null,

  openForCreate(prefillDate){
    EventModal._editingId = null;
    EventModal._images = [];
    const base = prefillDate ? new Date(prefillDate) : EventModal._roundToNextHalfHour(new Date());
    EventModal._render({
      id: Util.uuid(),
      name: "",
      detail: "",
      start: base.toISOString(),
      end: Util.addMinutes(base,30).toISOString(),
      durationLabel: "30 minutes",
      colorTag: "navy",
      images: []
    }, false);
  },

  async openForEdit(id){
    const full = await State.getFullEvent(id, true);
    if (!full){ Toast.show("Couldn't load that upload.", "error"); return; }
    EventModal._editingId = id;
    EventModal._images = (full.images || []).slice();
    EventModal._render(full, true);
  },

  close(){
    if (EventModal._scrimEl){ EventModal._scrimEl.remove(); EventModal._scrimEl = null; }
  },

  /** Rounds a Date up to the next :00 or :30, used to prefill a sensible start time. */
  _roundToNextHalfHour(d){
    const r = new Date(d);
    const mins = r.getMinutes();
    if (mins === 0 || mins === 30){ r.setSeconds(0,0); return r; }
    const add = mins < 30 ? (30 - mins) : (60 - mins);
    r.setMinutes(mins + add, 0, 0);
    return r;
  },

  _render(ev, isEdit){
    EventModal.close();
    const start = new Date(ev.start);
    const end = new Date(ev.end);

    const scrim = document.createElement("div");
    scrim.className = "modal-scrim";
    EventModal._scrimEl = scrim;

    const presetMatch = CONFIG.DURATION_PRESETS.find(p => p.label === ev.durationLabel);
    const isCustomDuration = !presetMatch;

    scrim.innerHTML = `
      <div class="modal">
        <div class="modal-header">
          <h2>${isEdit ? "Edit upload" : "New upload"}</h2>
          <button class="icon-btn" id="emClose">✕</button>
        </div>
        <div class="modal-body">

          <div class="field">
            <label for="emName">Event name</label>
            <input type="text" id="emName" placeholder="e.g. Instagram reel — new arrivals" value="${Util.escapeHtml(ev.name)}" />
          </div>

          <div class="field">
            <label for="emDetail">Event detail</label>
            <textarea id="emDetail" placeholder="Caption, hashtags, placement notes, approval status…">${Util.escapeHtml(ev.detail || "")}</textarea>
          </div>

          <div class="field-row">
            <div class="field">
              <label for="emDate">Date</label>
              <input type="date" id="emDate" value="${Util.toDateInputValue(start)}" />
            </div>
            <div class="field">
              <label for="emTime">Start time</label>
              <input type="time" id="emTime" value="${Util.toTimeInputValue(start)}" />
            </div>
          </div>

          <div class="field">
            <label for="emDuration">Event duration</label>
            <select id="emDuration">
              ${CONFIG.DURATION_PRESETS.map(p => `<option value="${p.label}" ${(!isCustomDuration && p.label===ev.durationLabel) ? "selected" : ""}>${p.label}</option>`).join("")}
            </select>
            <div class="duration-custom-row" id="emCustomRow" style="display:${isCustomDuration ? "flex":"none"};">
              <input type="number" min="1" id="emCustomValue" placeholder="Amount" value="${isCustomDuration ? (parseInt(ev.durationLabel)||1) : 1}" />
              <select id="emCustomUnit">
                ${CONFIG.CUSTOM_DURATION_UNITS.map(u => `<option value="${u.label}" ${isCustomDuration && ev.durationLabel && ev.durationLabel.includes(u.label) ? "selected":""}>${u.label}</option>`).join("")}
              </select>
            </div>
            <div class="field-hint">Pick a preset, or choose "Custom…" to type your own amount.</div>
          </div>

          <div class="field">
            <div class="computed-end" id="emComputedEnd"></div>
          </div>

          <div class="field">
            <label>Label</label>
            <div class="color-row" id="emColorRow">
              ${CONFIG.COLOR_TAGS.map(c => `
                <div class="color-swatch ${c.id===ev.colorTag ? "selected":""}" data-color-id="${c.id}" style="background:${c.value}" title="${Util.escapeHtml(c.label)}">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                </div>
              `).join("")}
            </div>
          </div>

          <div class="field">
            <label>Visual assets</label>
            <div class="dropzone" id="emDropzone">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
              <div class="dz-title">Click to upload, or drag files here</div>
              <div class="dz-sub">Images (PNG / JPG / GIF / WEBP) or a single .zip archive</div>
            </div>
            <input type="file" id="emFileInput" multiple accept=".png,.jpg,.jpeg,.gif,.webp,.bmp,.svg,.zip" style="display:none" />
            <div class="thumb-grid" id="emThumbGrid"></div>
            <div class="upload-toolbar">
              <span class="size-note" id="emSizeNote"></span>
              <button class="btn" id="emDownloadZip" ${EventModal._images.length ? "" : "disabled"}>Download all as .zip</button>
            </div>
          </div>

        </div>
        <div class="modal-footer">
          ${isEdit ? `<button class="btn btn-danger" id="emDelete">Delete</button>` : ""}
          <div class="spacer"></div>
          <button class="btn" id="emCancel">Cancel</button>
          <button class="btn btn-primary" id="emSave">${isEdit ? "Save changes" : "Add to calendar"}</button>
        </div>
      </div>
    `;

    document.getElementById("modalRoot").appendChild(scrim);
    scrim.addEventListener("click", (e) => { if (e.target === scrim) EventModal.close(); });
    document.getElementById("emClose").addEventListener("click", EventModal.close);
    document.getElementById("emCancel").addEventListener("click", EventModal.close);

    EventModal._wireDuration();
    EventModal._wireColorRow();
    EventModal._wireUploads();
    EventModal._renderThumbs();
    EventModal._recomputeEnd();

    if (isEdit){
      document.getElementById("emDelete").addEventListener("click", () => {
        Popover.close();
        ConfirmDialog.open({
          title: "Delete this upload?",
          body: `"${ev.name}" will be permanently removed for everyone.`,
          confirmLabel: "Delete",
          danger: true,
          onConfirm: async () => {
            await Store.deleteEvent(ev.id);
            State.invalidate(ev.id);
            await State.refreshIndex();
            EventModal.close();
            Toast.show("Upload deleted", "success");
          }
        });
      });
    }

    document.getElementById("emSave").addEventListener("click", () => EventModal._handleSave(ev.id));

    // live recompute end time as fields change
    ["emDate","emTime","emDuration","emCustomValue","emCustomUnit"].forEach(id => {
      document.getElementById(id).addEventListener("input", EventModal._recomputeEnd);
      document.getElementById(id).addEventListener("change", EventModal._recomputeEnd);
    });
  },

  _wireDuration(){
    const sel = document.getElementById("emDuration");
    sel.addEventListener("change", () => {
      const preset = CONFIG.DURATION_PRESETS.find(p => p.label === sel.value);
      document.getElementById("emCustomRow").style.display = (preset && preset.minutes === null) ? "flex" : "none";
      EventModal._recomputeEnd();
    });
  },

  _wireColorRow(){
    document.getElementById("emColorRow").addEventListener("click", (e) => {
      const sw = e.target.closest(".color-swatch");
      if (!sw) return;
      document.querySelectorAll("#emColorRow .color-swatch").forEach(s => s.classList.remove("selected"));
      sw.classList.add("selected");
    });
  },

  _currentDurationMinutes(){
    const sel = document.getElementById("emDuration");
    const preset = CONFIG.DURATION_PRESETS.find(p => p.label === sel.value);
    if (preset && preset.minutes !== null) return { minutes: preset.minutes, label: preset.label };
    const amount = Math.max(1, parseInt(document.getElementById("emCustomValue").value, 10) || 1);
    const unitLabel = document.getElementById("emCustomUnit").value;
    const unit = CONFIG.CUSTOM_DURATION_UNITS.find(u => u.label === unitLabel) || CONFIG.CUSTOM_DURATION_UNITS[0];
    return { minutes: amount * unit.mult, label: `${amount} ${unit.label}` };
  },

  _recomputeEnd(){
    const dateVal = document.getElementById("emDate").value;
    const timeVal = document.getElementById("emTime").value;
    if (!dateVal || !timeVal) return;
    const start = Util.parseDateTimeInputs(dateVal, timeVal);
    const { minutes, label } = EventModal._currentDurationMinutes();
    const end = Util.addMinutes(start, minutes);
    document.getElementById("emComputedEnd").innerHTML = `
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 15"/></svg>
      Ends ${Util.formatDayLabel(end)} at ${Util.formatTimeShort(end)} <span style="opacity:.6">(${label})</span>
    `;
  },

  _wireUploads(){
    const dz = document.getElementById("emDropzone");
    const input = document.getElementById("emFileInput");
    dz.addEventListener("click", () => input.click());
    input.addEventListener("change", () => EventModal._ingestFiles(input.files));

    ["dragover","dragenter"].forEach(evt => dz.addEventListener(evt, (e) => { e.preventDefault(); dz.classList.add("drag-over"); }));
    ["dragleave","drop"].forEach(evt => dz.addEventListener(evt, (e) => { e.preventDefault(); dz.classList.remove("drag-over"); }));
    dz.addEventListener("drop", (e) => { if (e.dataTransfer.files.length) EventModal._ingestFiles(e.dataTransfer.files); });

    document.getElementById("emDownloadZip").addEventListener("click", () => {
      const nameField = document.getElementById("emName");
      ImageZip.downloadAsZip(EventModal._images, nameField.value || "rigel-event");
    });
  },

  async _ingestFiles(fileList){
    const dz = document.getElementById("emDropzone");
    const originalHtml = dz.innerHTML;
    dz.innerHTML = `<div class="dz-title">Processing…</div>`;
    const added = await ImageZip.processIncomingFiles(fileList, (msg) => { dz.innerHTML = `<div class="dz-title">${Util.escapeHtml(msg)}</div>`; });
    EventModal._images = EventModal._images.concat(added);
    dz.innerHTML = originalHtml;
    if (added.length === 0){
      Toast.show("No supported images found in that upload.", "error");
    }
    EventModal._renderThumbs();
  },

  _renderThumbs(){
    const grid = document.getElementById("emThumbGrid");
    grid.innerHTML = EventModal._images.map(img => `
      <div class="thumb" data-img-id="${img.id}">
        <img src="${img.dataUrl}" alt="${Util.escapeHtml(img.filename)}" />
        <button class="thumb-remove" data-remove-img="${img.id}">✕</button>
        <div class="thumb-name">${Util.escapeHtml(img.filename)}</div>
      </div>
    `).join("");
    grid.querySelectorAll("[data-remove-img]").forEach(btn => {
      btn.addEventListener("click", () => {
        EventModal._images = EventModal._images.filter(i => i.id !== btn.dataset.removeImg);
        EventModal._renderThumbs();
      });
    });
    const total = ImageZip.totalBytes(EventModal._images);
    document.getElementById("emSizeNote").textContent = EventModal._images.length
      ? `${EventModal._images.length} file${EventModal._images.length>1?"s":""} · ${Util.formatBytes(total)}`
      : "No files attached yet";
    const zipBtn = document.getElementById("emDownloadZip");
    if (zipBtn) zipBtn.disabled = EventModal._images.length === 0;

    if (total > CONFIG.MAX_EVENT_PAYLOAD_BYTES){
      Toast.show("These images are quite large — consider removing a few before saving.", "error");
    }
  },

  async _handleSave(id){
    const name = document.getElementById("emName").value.trim();
    if (!name){ Toast.show("Give this upload a name first.", "error"); return; }

    const dateVal = document.getElementById("emDate").value;
    const timeVal = document.getElementById("emTime").value;
    const start = Util.parseDateTimeInputs(dateVal, timeVal);
    const { minutes, label } = EventModal._currentDurationMinutes();
    const end = Util.addMinutes(start, minutes);
    const colorSwatch = document.querySelector("#emColorRow .color-swatch.selected");
    const colorTag = colorSwatch ? colorSwatch.dataset.colorId : "navy";
    const detail = document.getElementById("emDetail").value;

    const saveBtn = document.getElementById("emSave");
    saveBtn.disabled = true;
    saveBtn.textContent = "Saving…";

    const fullEvent = {
      id,
      schemaVersion: CONFIG.EVENT_DEFAULTS.schemaVersion,
      name,
      detail,
      start: start.toISOString(),
      end: end.toISOString(),
      durationLabel: label,
      colorTag,
      status: "scheduled",
      images: EventModal._images,
      customFields: {}
    };

    const ok = await Store.saveEvent(fullEvent);
    if (!ok){
      Toast.show("Couldn't save — the attached files may be too large. Try removing one.", "error");
      saveBtn.disabled = false;
      saveBtn.textContent = EventModal._editingId ? "Save changes" : "Add to calendar";
      return;
    }

    State.invalidate(id);
    await State.refreshIndex();
    EventModal.close();
    Toast.show(EventModal._editingId ? "Upload updated" : "Upload added to calendar", "success");
  }
};
/* ============================================================================
   14. BOOTSTRAP
   ============================================================================ */
const App = {
  async init(){
    Shell.init();
    State.onChange(() => Shell.render());

    // Global escape key closes whatever floating UI is open
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape"){
        Popover.close();
        AgendaModal.close();
        EventModal.close();
      }
    });

    await State.refreshIndex();
    Shell.render();

    document.getElementById("loadingScreen").style.display = "none";
    document.getElementById("app").style.display = "flex";

    // Live-sync polling: pick up changes made by other people / other tabs.
    // Skipped while a modal/popover is open so we don't yank the UI away
    // from someone mid-edit.
    setInterval(() => {
      const busy = document.querySelector(".modal-scrim") || State.openPopoverId;
      if (!busy) State.refreshIndex();
    }, CONFIG.POLL_INTERVAL_MS);
  }
};

if (!_firebaseReady){
  document.addEventListener("DOMContentLoaded", () => {
    document.getElementById("loadingScreen").innerHTML =
      '<div style="max-width:320px;text-align:center;font-size:13px;line-height:1.6;">Firebase isn\'t configured yet, so the calendar can\'t save or load data.<br><br>Open this file and paste your Firebase project config into the <code>FIREBASE_CONFIG</code> object near the top of the &lt;script&gt; section.</div>';
  });
} else {
  document.addEventListener("DOMContentLoaded", () => { App.init(); });
}

</script>
